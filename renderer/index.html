<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Drop</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app">
        <header>
            <h1>Drop</h1>
            <div class="header-controls">
                <label class="toggle">
                    <input type="checkbox" id="clipboardToggle" />
                    Auto-capture clipboard
                </label>
                <input id="search" type="text" placeholder="Search..." />
            </div>
        </header>

        <div id="dropzone">Drag files here to save them</div>
        <main id="feed"></main>

        <form id="composer">
            <input id="tags" type="text" placeholder="tags (comma separated)" />
            <textarea id="content" placeholder="Paste a snippet, command, or note..." rows="3"></textarea>
            <button type="submit">Save</button>
        </form>
    </div>

    <script src="web-adapter.js"></script>
    <script src="renderer.js"></script>
</body>

</html>
