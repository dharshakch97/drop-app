name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.11 (for node-gyp native build compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Python for node-gyp on Windows
        if: runner.os == 'Windows'
        run: |
          echo "PYTHON=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV
          echo "npm_config_python=$env:pythonLocation\python.exe" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup MSBuild for Windows
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build Electron App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist
